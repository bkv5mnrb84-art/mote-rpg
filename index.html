<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#15191f"><link rel="manifest" href="manifest.json"><title>モテ男育成 RPG</title><style> *{box-sizing:border-box}body{background:#15191f;color:#f3f0e9;font:16px system-ui;margin:0;padding:24px 16px 40px}main{max-width:480px;margin:auto}h1{font-size:25px}h2{font-size:17px}small{color:#b8b6b0}section{background:#242a33;border:1px solid #41444a;border-radius:16px;padding:16px;margin:14px 0}strong{color:#e8c17a}button,input{font:inherit}button{background:#373e49;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.45}label{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #41444a}label strong{margin-left:auto;white-space:nowrap}input[type=checkbox]{width:22px;height:22px;accent-color:#d8b66e}progress{width:100%;accent-color:#d8b66e}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.clear{background:#396b50}.selected{outline:2px solid #e8c17a}.gold{background:#e8c17a;color:#15191f;width:100%;font-weight:bold}.large{font-size:32px}p{line-height:1.6}</style><main id="app"></main><script>
const q=[['朝晩の歯磨き',10,1],['身だしなみ',10,1],['勉強10分',15,2],['筋トレ5分',20,0],['読書10分',15,2],['自分から挨拶・会話',15,3],['片付け5分',10,5],['21:50 スマホ終了',15,5],['22時就寝',20,5],['趣味・新しい体験',30,4]],names=['肉体','清潔感','知性','社交力','個性','自己管理'],rewards=['音楽3曲','コーヒー','漫画1話','ゆっくり入浴','ご褒美貯金100円','ご褒美貯金300円'],thresholds=[0,250,500,1000,1500,3000,5000,10000];const date=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state;try{state=JSON.parse(localStorage.getItem('moteRPG'))}catch{}if(!state)state={start:date(),records:{}};let tab=0,selected=date();const dayKey=i=>{let d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const rec=()=>state.records[selected]??(state.records[selected]={done:[],reward:null});const score=r=>(r?.done||[]).reduce((s,i)=>s+q[i][1],0);function save(){try{localStorage.setItem('moteRPG',JSON.stringify(state));return true}catch{return false}}function render(){let r=rec(),xp=score(r),total=Object.values(state.records).reduce((s,r)=>s+score(r),0),lv=thresholds.filter(x=>x<=total).length;let weekday=new Date(selected+'T12:00:00').getDay(),mission=['翌週準備・外出','筋トレ','読書10分','筋トレ','柔軟10分','筋トレ','自由・休息'][weekday];let html=`<small>SELF DEVELOPMENT RPG</small><h1>モテ男育成計画</h1><section><small>PLAYER LEVEL</small><div class="large"><strong>Lv.${lv}</strong></div><p>累計 ${total} XP</p><progress value="${lv===8?1:total-thresholds[lv-1]}" max="${lv===8?1:thresholds[lv]-thresholds[lv-1]}"></progress></section><nav>${['クエスト','能力値','30日記録','ガチャ'].map((t,i)=>`<button onclick="tab=${i};render()">${t}</button>`).join('')}</nav><p>${selected} <button onclick="selected=date();render()">今日</button></p>`;if(tab===0)html+=`<section><h2>今日のミッション：${mission}</h2>${mission==='筋トレ'?'<small>腕立て10回・リバーススノーエンジェル15回・レッグレイズ10回・サイドプランク左右20秒・スクワット15回 各1セット</small>':''}<p class="large"><strong>${xp}</strong> / 50 XP</p><progress value="${Math.min(xp,50)}" max="50"></progress><p>${xp>=50?'クエストクリア！':'できたことだけチェック'}</p>${q.map((a,i)=>`<label><input type="checkbox" ${r.done.includes(i)?'checked':''} onchange="toggle(${i})">${a[0]}<strong>+${a[1]}</strong></label>`).join('')}<p><small>疲れた日は休息優先。未達成でも減点なし。</small></p></section>`;if(tab===1)html+=`<section>${names.map((n,i)=>{let v=Object.values(state.records).reduce((s,r)=>s+r.done.reduce((a,j)=>a+(q[j][2]===i?q[j][1]:0),0),0);return `<p>${n} <strong>${v} XP</strong></p><progress value="${Math.min(v,500)}" max="500"></progress>`}).join('')}<p><small>能力値は行動記録の指標です。</small></p></section>`;if(tab===2)html+=`<section><h2>30日間の記録</h2><p>初期ボーナス ★★★</p><div class="days">${Array.from({length:30},(_,i)=>{let k=dayKey(i);return `<button class="${score(state.records[k])>=50?'clear':''} ${selected===k?'selected':''}" ${k>date()?'disabled':''} onclick="selected='${k}';tab=0;render()">${i+1}</button>`}).join('')}</div><p>緑は50XP達成日。日付を押すと編集できます。</p></section>`;if(tab===3)html+=`<section><h2>🎲 ご褒美ガチャ</h2><p>${r.reward||'50XPで解放'}</p><button class="gold" ${xp<50||r.reward?'disabled':''} onclick="rec().reward=rewards[Math.floor(Math.random()*6)];render()">${r.reward?'抽選済み':'サイコロを振る'}</button><p><small>1日1回、課金なし。</small></p></section>`;document.getElementById('app').innerHTML=html+`<small>${save()?'端末内に自動保存':'保存できません。ブラウザ設定を確認してください。'}</small>`}function toggle(i){let r=rec();r.done=r.done.includes(i)?r.done.filter(x=>x!==i):[...r.done,i];render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
