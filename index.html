const q=[['朝晩の歯磨き・夜の歯間ケア',10,1],['洗顔・保湿・身だしなみ',10,1],['資格の過去問10分',15,2],['全身筋トレ10分',20,0],['読書10分',10,2],['自分から雑談・傾聴',15,3],['タンパク質100g摂取',15,0],['就寝30分前スマホ断ち',15,5],['前夜の睡眠7時間以上',25,5],['趣味15分',15,4]],names=['肉体','清潔感','知性','社交力','個性','自己管理'];const oldQ=[[10,1],[10,1],[15,2],[20,0],[15,2],[15,3],[10,5],[15,5],[20,5],[30,4]];const need=l=>Math.min(500,Math.round(5*l**.8)*10);function level(t){let l=1;while(t>=need(l)){t-=need(l);l++}return [l,t,need(l)]}const prizes=[[40,'N','potion'],[70,'R','stone'],[82,'SR','training'],[90,'SR','resonance'],[99,'SSR','key'],[100,'UR','relic']];const date=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const weekStart=k=>{let d=new Date(k+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const workoutDays=k=>[0,2,4].map(n=>{let d=new Date(weekStart(k)+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});let state;try{state=JSON.parse(localStorage.getItem('moteRPG'))}catch{}if(!state)state={start:date(),records:{}};if(!state.version){for(const r of Object.values(state.records)){r.legacy=r.done.map(i=>oldQ[i]);r.done=[];r.legacyClear=r.legacy.reduce((a,x)=>a+x[0],0)>=50;}state.version=2;}let tab=0,selected=date();const dayKey=i=>{let d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const rec=()=>state.records[selected]??(state.records[selected]={done:[],reward:null});const base=r=>(r?.done||[]).reduce((s,i)=>s+q[i][1],0);const score=r=>(r?.legacy||[]).reduce((s,x)=>s+x[0],0)+(r?.done||[]).reduce((s,i)=>s+(q[i][1]*(r.mult?.[i]||1)+(r.boost?.[i]||0)),0)+(r?.weeklyWorkoutBonus||0);const clear=r=>!!r?.legacyClear||base(r)>=50;function save(){try{localStorage.setItem('moteRPG',JSON.stringify(state));return true}catch{return false}}const tiers=[0,100,300,600,1000,2000,3000,5000,10000],ranks=['F','E','D','C','B','A','S','SS','SSS'],titles=[['原石','修行者','鍛錬者','戦士','強者','武人','肉体の完成者','超人','伝説の戦士'],['原石','清潔の見習い','整える者','好印象男子','洗練者','紳士','洗練された男','気品の達人','至高の紳士'],['原石','学習者','探究者','知将','研究者','賢者','知の達人','大賢者','知の巨匠'],['原石','挑戦者','聞き上手','会話上手','交流者','社交の達人','人を結ぶ者','名ホスト','交流の巨匠'],['原石','探検者','表現者','才人','個性派','カリスマ','魅力の達人','創造者','唯一無二'],['原石','見習い','習慣の守り手','自律者','規律の達人','己を制する者','自己管理の達人','不動心','自律の巨匠']],colors=['#ef7744','#56bcd9','#a78bfa','#e9b849','#ec78a9','#55a8ed'];function statXP(i){return Object.values(state.records).reduce((s,r)=>s+(r.legacy||[]).reduce((a,x)=>a+(x[1]===i?x[0]:0),0)+(r.done||[]).reduce((a,j)=>a+(q[j][2]===i?(q[j][1]*(r.mult?.[j]||1)+(r.boost?.[j]||0)):0),0)+(i===0?(r.weeklyWorkoutBonus||0):0),0)}function statRank(v){return tiers.reduce((a,t,j)=>v>=t?j:a,0)}state.statAwards??={};state.items??={};if(!state.v5Migrated){for(const r of Object.values(state.records)){r.boostChecked??={};for(const i of Object.keys(r.mult||{}))r.boostChecked[i]=true;for(const i of r.done||[])r.boostChecked[i]=true}state.v5Migrated=true;}state.active??={};state.secrets??={};state.lifeQuests??={unlocked:{},cleared:{}};state.lifeQuests.unlocked??={};state.lifeQuests.cleared??={};if(state.secrets.key)state.lifeQuests.unlocked.key=true;if(state.secrets.relic)state.lifeQuests.unlocked.relic=true;
const items={potion:['成長薬','次の新規クエストの基本XP ×1.5'],stone:['能力強化石','最も低い能力の次回クエストの基本XP ×2'],training:['修練の秘薬','指定能力の新規クエスト3回、基本XP ×1.5'],resonance:['共鳴の結晶','異なる3能力を鍛えると称号を解放'],key:['謎の鍵','使用条件：不明'],relic:['封印された遺物','鑑定条件：不明']};const lifeQuestCatalog={key:['現実領域の踏破','日曜日、映画館で映画を一本観る。','現実踏破者'],relic:['未踏領域の調査','日曜日、行ったことのない街へ出かけて、1時間歩く。','未踏の探索者']};
function give(id){state.items[id]=(state.items[id]||0)+1}function weakest(){return names.map((_,i)=>i).sort((a,b)=>statXP(a)-statXP(b))[0]}
function activate(id){if(!state.items[id]||state.active[id]||!['potion','stone','training','resonance'].includes(id))return;state.items[id]--;state.active[id]={target:weakest(),left:id==='training'?3:1,seen:[]};render()}
function applyBoost(r,i){if(selected!==date()||r.boostChecked?.[i]||r.mult?.[i]&&r.done.includes(i))return;r.boostChecked??={};r.boostChecked[i]=true;r.boost??={};let a=state.active,st=q[i][2],id=a.stone&&a.stone.target===st?'stone':a.training&&a.training.target===st?'training':a.potion?'potion':null;if(id){r.boost[i]=Math.floor(q[i][1]*(id==='stone'?1:.5));if(--a[id].left===0)delete a[id];enqueue('BOOST ACTIVE',items[id][0]+' · +'+r.boost[i]+' XP',2,'#68df9c')}if(a.resonance&&!a.resonance.seen.includes(st)){a.resonance.seen.push(st);if(a.resonance.seen.length===3){delete a.resonance;state.secrets.resonance=true;enqueue('TITLE UNLOCK','共鳴する者',3,'#62dcff')}}}
function secretCheck(){let lv=level(totalXP())[0];for(const [id,ok,title] of [['key',lv>=10&&names.every((_,i)=>statXP(i)>=100),'境界を越える者'],['relic',lv>=20&&names.every((_,i)=>statXP(i)>=300),'封印を解く者']]){if(state.items[id]&&ok&&!state.lifeQuests.unlocked[id]){if(!state.secrets[id]){state.secrets[id]=title;enqueue('IMPORTANT ITEM · 解放',title+' · 特別称号獲得',4,'#c5b1ff')}state.items[id]--;state.lifeQuests.unlocked[id]=true;tab=2;let quest=lifeQuestCatalog[id];enqueue('UNKNOWN QUEST UNLOCKED',quest[0]+' · 現実の高難易度クエスト',4,'#c5b1ff')}}}
function specialQuestView(){let available=Object.keys(lifeQuestCatalog).filter(id=>state.lifeQuests.unlocked[id]);if(!available.length)return '<section><small>ACCESS LOCKED</small><h2>未知領域</h2><p>アクセス権限がありません。</p></section>';return available.map(id=>{let [title,objective,award]=lifeQuestCatalog[id],cleared=!!state.lifeQuests.cleared[id];return `<section><small>HIGH DIFFICULTY QUEST</small><h2>${title}</h2><p>${objective}</p>${cleared?`<p><strong>SYSTEM // CLEAR</strong></p><small>称号獲得：${award}</small>`:`<button class="gold" onclick="completeLifeQuest('${id}')">任務達成</button>`}</section>`}).join('')}
function completeLifeQuest(id){if(!lifeQuestCatalog[id]||!state.lifeQuests.unlocked[id]||state.lifeQuests.cleared[id])return;let award=lifeQuestCatalog[id][2];state.lifeQuests.cleared[id]=true;state.secrets['lifeQuest_'+id]=award;give('potion');enqueue('HIGH DIFFICULTY QUEST CLEAR',award+' · 成長薬獲得',4,'#ffd26b');render();nextFx()}

function awardStats(){let events=[];for(let i=0;i<6;i++){let rank=statRank(statXP(i));for(let j=1;j<=rank;j++){let key=i+':'+j;if(!state.statAwards[key]){state.statAwards[key]={amount:0};if(j>=2)give(j>=5?'training':'stone');events.push([i,j])}}}return events}function awaken(events){if(!events.length)return;let [i,j]=events[events.length-1];effect(names[i]+' 覚醒',ranks[j]+' · '+titles[i][j],3,colors[i])}let initialAwards=awardStats();state.hidden??={};state.milestones??={};const hidden=[['静かなる努力',100,()=>Object.values(state.records).filter(r=>r.done?.includes(3)).length>=7],['知識の蓄積',80,()=>Object.values(state.records).filter(r=>r.done?.includes(2)).length>=5],['見えない変化',100,()=>statXP(1)>=150],['均衡の力',150,()=>names.every((_,i)=>statXP(i)>=100)],['積み重なる日々',120,()=>Object.values(state.records).filter(clear).length>=10],['一歩踏み出す者',80,()=>Object.values(state.records).filter(r=>r.done?.includes(5)).length>=5],['自分との約束',100,()=>statXP(5)>=300],['未知への一歩',80,()=>Object.values(state.records).filter(r=>r.done?.includes(9)).length>=5]];function bonusXP(){return Object.values(state.hidden).reduce((a,x)=>a+x.xp,0)}function unlockHidden(){let out=[];hidden.forEach(([title,xp,test],i)=>{if(!state.hidden[i]&&test()){state.hidden[i]={title,xp:0};give("potion");out.push({title,xp:0})}});return out}let fxQueue=[];function enqueue(...args){fxQueue.push(args)}function nextFx(){if(!document.querySelector('.impact')&&fxQueue.length)effect(...fxQueue.shift())}function levelEvents(before,after){if(after<=before)return;for(let l=before+1;l<=after;l++){if(l%10===0&&!state.milestones[l]){state.milestones[l]=true;enqueue('LEVEL '+l,'LIMIT BREAK · '+(l===10?'第一覚醒':l===20?'第二覚醒':l===30?'第三覚醒':'限界突破'),4,'#b9eaff','milestone')}}enqueue('LEVEL UP','Lv.'+before+' → Lv.'+after,3,'#62dcff','levelFx')}function growth(){let cutoff=new Date(date()+'T12:00:00');cutoff.setDate(cutoff.getDate()-7);let k=cutoff.getFullYear()+'-'+String(cutoff.getMonth()+1).padStart(2,'0')+'-'+String(cutoff.getDate()).padStart(2,'0');let old=Object.entries(state.records).filter(([d])=>d<=k).reduce((a,[,r])=>a+score(r),0);let recent=Object.entries(state.records).filter(([d])=>d>k).reduce((a,[,r])=>a+score(r),0);return `<section><h2>GROWTH LOG</h2><p>直近7日間の行動XP <strong>+${recent}</strong></p><small>7日前までの行動XP：${old} → 現在：${old+recent}（隠し報酬を除く）</small><h2>HIDDEN QUEST</h2><p>発見済み ${Object.keys(state.hidden).length} / ${hidden.length}</p>${Object.values(state.hidden).map(x=>`<p>${x.title} <strong>${x.xp?"+"+x.xp+" XP":"ITEM ACQUIRED"}</strong></p>`).join('')}<small>未発見の条件：閲覧権限がありません。</small></section>`}function render(){let r=rec(),xp=score(r),total=totalXP(),[lv,progress,max]=level(total);let weekday=new Date(selected+'T12:00:00').getDay(),mission=['翌週準備・外出','筋トレ','読書10分','筋トレ','柔軟10分','筋トレ','自由・休息'][weekday];let html=`<small>SYSTEM // ONLINE</small><h1>SYSTEM</h1><section><small>PLAYER STATUS // LEVEL</small><div class="large"><strong>Lv.${lv}</strong></div><p>累計 ${total} XP · 次まで ${max-progress} XP</p><progress value="${progress}" max="${max}"></progress></section><nav>${['クエスト','能力値',Object.values(state.lifeQuests.unlocked).some(Boolean)?'特別任務':'？？？','報酬','所持品'].map((t,i)=>`<button aria-current="${tab===i}" ${i===2&&!Object.values(state.lifeQuests.unlocked).some(Boolean)?'disabled':''} onclick="tab=${i};render()">${t}</button>`).join('')}</nav>${tab===0||tab===3?`<p>${selected} <button onclick="selected=date();render()">今日</button></p>`:''}`;if(tab===0){let days=workoutDays(selected),weeklyDone=days.filter(k=>state.records[k]?.weeklyWorkoutDone).length,weeklyAwarded=days.some(k=>state.records[k]?.weeklyWorkoutBonus);html+=`<section><h2>DAILY QUEST // ${mission}${mission==='筋トレ'?` <input aria-label="週間筋トレ達成" type="checkbox" ${r.weeklyWorkoutDone?'checked':''} onchange="toggleWeeklyWorkout()">`:''}</h2>${mission==='筋トレ'?'<small>腕立て10回・リバーススノーエンジェル15回・レッグレイズ10回・サイドプランク左右20秒・スクワット15回 各1セット</small>':''}<p>週間筋トレチャレンジ：${weeklyDone} / 3回${weeklyAwarded?' · 達成済み +100 XP':''}</p><p class="large"><strong>${base(r)}</strong> / 50 XP</p><progress value="${Math.min(base(r),50)}" max="50"></progress><p>${clear(r)?'SYSTEM // 任務達成':'任務を遂行してください。'}</p>${q.map((a,i)=>`<label><input type="checkbox" ${r.done.includes(i)?'checked':''} onchange="toggle(${i})">${a[0]}<strong>+${a[1]}</strong></label>`).join('')}<p><small>疲れた日は休息優先。筋トレは月水金を基本に。週3回達成で追加100XP。通常の全身筋トレ20XPとは別枠。</small></p></section>`;}if(tab===1)html+=`<section>${names.map((n,i)=>{let v=statXP(i),j=statRank(v),next=tiers[j+1];return `<div style="margin:16px 0"><p style="margin:0"><strong style="color:${colors[i]}">${ranks[j]} · ${n}</strong>　${v} XP</p><small>${titles[i][j]} · ${next? '次まで '+(next-v)+' XP':'最高ランク'}</small><progress style="accent-color:${colors[i]}" value="${next?v-tiers[j]:1}" max="${next?next-tiers[j]:1}"></progress><small>${next?'次の報酬：'+(j+1>=2?'アイテム ＋ ':'')+'称号':'全ランク達成'}</small></div>`}).join('')}<small>能力値は行動記録の指標です。報酬は各ランク初回のみ。</small></section>`;if(tab===2)html+=specialQuestView();if(tab===3)html+=`<section><h2>REWARD BOX</h2><p>${r.reward?'受領済み'+(r.item?' · '+items[r.item][0]:'（旧報酬）'):'50XPで解放'}</p><button class="gold" ${!clear(r)||r.reward?'disabled':''} onclick="draw()">${r.reward?'受領済み':'報酬を受領する'}</button><p><small>1日1回。N 40% / R 30% / SR 20% / SSR 9% / UR 1%</small></p></section>`;if(tab===4)html+=inventory();document.getElementById('app').innerHTML=html+`<small>${save()?'端末内に自動保存':'保存できません。ブラウザ設定を確認してください。'}</small>`}function totalXP(){return Object.values(state.records).reduce((a,r)=>a+score(r),0)+bonusXP()}function toggleWeeklyWorkout(){let r=rec(),before=level(totalXP())[0];r.weeklyWorkoutDone=!r.weeklyWorkoutDone;let days=workoutDays(selected),allDone=days.every(k=>state.records[k]?.weeklyWorkoutDone),alreadyAwarded=days.some(k=>state.records[k]?.weeklyWorkoutBonus);if(allDone&&!alreadyAwarded){r.weeklyWorkoutBonus=100;enqueue('WEEKLY CHALLENGE CLEAR','筋トレ3回達成 · +100 XP',3,'#62dcff')}let events=awardStats(),found=unlockHidden(),after=level(totalXP())[0];levelEvents(before,after);for(const [i,j] of events)enqueue(names[i]+' 覚醒',ranks[j]+' · '+titles[i][j]+(j>=2?' · ITEM ACQUIRED':''),3,colors[i]);for(const x of found)enqueue('HIDDEN QUEST',x.title+' · ITEM ACQUIRED',3,'#a8a0ff');secretCheck();render();nextFx()}function toggle(i){let r=rec(),before=level(totalXP())[0];if(r.done.includes(i)){r.done=r.done.filter(x=>x!==i);render();return}r.mult??={};if(!r.mult[i]){let u=Math.random();r.mult[i]=u<.02?3:u<.17?2:1}applyBoost(r,i);r.done.push(i);let m=r.mult[i],events=awardStats(),found=unlockHidden(),after=level(totalXP())[0];enqueue(m===3?'超成功':m===2?'大成功':'任務達成','+'+q[i][1]*m+(r.boost?.[i]?' ＋ BOOST '+r.boost[i]:'')+' XP',m);levelEvents(before,after);for(const [j,k] of events)enqueue(names[j]+' 覚醒',ranks[k]+' · '+titles[j][k]+(k>=2?' · ITEM ACQUIRED':''),3,colors[j]);for(const x of found)enqueue('HIDDEN QUEST',x.title+' · ITEM ACQUIRED',3,'#a8a0ff');secretCheck();render();nextFx()}function draw(){let r=rec();if(!clear(r)||r.reward)return;let roll=Math.random()*100;let [_,rank,id]=prizes.find(x=>roll<x[0]);r.reward=rank+' · '+items[id][0];r.item=id;give(id);enqueue(rank==='SSR'||rank==='UR'?'IMPORTANT ITEM ACQUIRED':rank+' · ITEM ACQUIRED',items[id][0],rank==='UR'?4:rank==='SSR'?3:rank==='SR'?2:1,rank==='UR'?'#ffd26b':rank==='SSR'?'#c5b1ff':'#62dcff');secretCheck();render();nextFx()}function effect(title,sub,power,color,kind=""){document.querySelector('.impact')?.remove();let el=document.createElement('div');el.className='impact p'+power+' '+kind;if(color)el.style.setProperty('--fx',color);el.innerHTML=`<div class="rays"></div><svg viewBox="0 0 360 600" preserveAspectRatio="none"><path d="M10 0 L130 170 80 210 190 300 120 420 220 600 M350 0 L240 160 290 210 190 300 270 460 240 600"/></svg><div class="impactText"><small>ⓘ NOTIFICATION</small><b>${title}</b><span>${sub}</span><em>TAP TO CLOSE</em></div>`;document.body.append(el);let timer;const close=()=>{clearTimeout(timer);el.remove();nextFx()};timer=setTimeout(close,kind==='milestone'?4500:power===1?1200:3000);el.onclick=close;try{let c=new (window.AudioContext||window.webkitAudioContext)();c.resume();[110,220,440,660].slice(0,power).forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.09;o.type=i===0?'triangle':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.36)});setTimeout(()=>c.close(),900)}catch{}}let startingLevel=level(totalXP())[0];let discovered=unlockHidden();levelEvents(startingLevel,level(totalXP())[0]);for(const x of discovered)enqueue('HIDDEN QUEST',x.title+' · ITEM ACQUIRED',3,'#a8a0ff');for(const [i,j] of initialAwards)enqueue(names[i]+' 覚醒',ranks[j]+' · '+titles[i][j],3,colors[i]);secretCheck();render();nextFx();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
