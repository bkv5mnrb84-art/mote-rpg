<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#15191f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>モテ男育成 RPG</title><style> *{box-sizing:border-box}body{background:#15191f;color:#f3f0e9;font:16px system-ui;margin:0;padding:24px 16px 40px}main{max-width:480px;margin:auto}h1{font-size:25px}h2{font-size:17px}small{color:#b8b6b0}section{background:#242a33;border:1px solid #41444a;border-radius:16px;padding:16px;margin:14px 0}strong{color:#e8c17a}button,input{font:inherit}button{background:#373e49;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.45}label{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #41444a}label strong{margin-left:auto;white-space:nowrap}input[type=checkbox]{width:22px;height:22px;accent-color:#d8b66e}progress{width:100%;accent-color:#d8b66e}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.clear{background:#396b50}.selected{outline:2px solid #e8c17a}.gold{background:#e8c17a;color:#15191f;width:100%;font-weight:bold}.large{font-size:32px}p{line-height:1.6} .impact{position:fixed;inset:0;z-index:99;display:grid;place-items:center;overflow:hidden;background:#090b12ed;--fx:#d8b66e;cursor:pointer}.impact.p2{--fx:#70baff}.impact.p3{--fx:#ffd26b}.impact.p4{--fx:#ffb9ff}.impact.p1{background:#111b;pointer-events:none}.impact svg{position:absolute;width:100%;height:100%;filter:drop-shadow(0 0 12px var(--fx));animation:bolt .65s ease-out both}.impact path{fill:none;stroke:var(--fx);stroke-width:5;stroke-linejoin:bevel}.impact.p1 svg{display:none}.impactText{position:relative;text-align:center;animation:slam .45s cubic-bezier(.2,.8,.3,1.2) both;color:var(--fx);text-shadow:0 0 25px var(--fx),0 4px #000}.impactText b{display:block;font-size:clamp(36px,12vw,76px);font-weight:1000}.impactText span{display:block;font-size:clamp(30px,10vw,64px);font-weight:900}.rays{position:absolute;inset:-80%;background:repeating-conic-gradient(transparent 0deg,var(--fx) 12deg,transparent 24deg);opacity:.13;animation:spin 8s linear infinite}.p1 .rays{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slam{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bolt{from{opacity:.8}to{opacity:0}}@media(prefers-reduced-motion:reduce){.impact *{animation:none!important}.impact svg,.rays{display:none}}</style><main id="app"></main><script>
const q=[['朝晩の歯磨き・夜の歯間ケア',10,1],['洗顔・保湿・身だしなみ',10,1],['資格の過去問10分',15,2],['全身筋トレ10分',20,0],['読書10分',10,2],['自分から雑談・傾聴',15,3],['タンパク質100g摂取',15,0],['就寝30分前スマホ断ち',15,5],['前夜の睡眠7時間以上',25,5],['趣味15分',15,4]],names=['肉体','清潔感','知性','社交力','個性','自己管理'];const oldQ=[[10,1],[10,1],[15,2],[20,0],[15,2],[15,3],[10,5],[15,5],[20,5],[30,4]];const need=l=>Math.min(500,Math.round(5*l**.8)*10);function level(t){let l=1;while(t>=need(l)){t-=need(l);l++}return [l,t,need(l)]}const prizes=[[40,'N',100],[70,'R',200],[90,'SR',500],[99,'SSR',1000],[100,'UR',3000]];const date=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state;try{state=JSON.parse(localStorage.getItem('moteRPG'))}catch{}if(!state)state={start:date(),records:{}};if(!state.version){for(const r of Object.values(state.records)){r.legacy=r.done.map(i=>oldQ[i]);r.done=[];r.legacyClear=r.legacy.reduce((a,x)=>a+x[0],0)>=50;}state.version=2;}let tab=0,selected=date();const dayKey=i=>{let d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const rec=()=>state.records[selected]??(state.records[selected]={done:[],reward:null});const base=r=>(r?.done||[]).reduce((s,i)=>s+q[i][1],0);const score=r=>(r?.legacy||[]).reduce((s,x)=>s+x[0],0)+(r?.done||[]).reduce((s,i)=>s+q[i][1]*(r.mult?.[i]||1),0);const clear=r=>!!r?.legacyClear||base(r)>=50;function save(){try{localStorage.setItem('moteRPG',JSON.stringify(state));return true}catch{return false}}const tiers=[0,100,300,600,1000,2000,3000,5000,10000],ranks=['F','E','D','C','B','A','S','SS','SSS'],cash=[0,0,300,500,1000,2000,3000,0,0],titles=[['原石','修行者','鍛錬者','戦士','強者','武人','肉体の完成者','超人','伝説の戦士'],['原石','清潔の見習い','整える者','好印象男子','洗練者','紳士','洗練された男','気品の達人','至高の紳士'],['原石','学習者','探究者','知将','研究者','賢者','知の達人','大賢者','知の巨匠'],['原石','挑戦者','聞き上手','会話上手','交流者','社交の達人','人を結ぶ者','名ホスト','交流の巨匠'],['原石','探検者','表現者','才人','個性派','カリスマ','魅力の達人','創造者','唯一無二'],['原石','見習い','習慣の守り手','自律者','規律の達人','己を制する者','自己管理の達人','不動心','自律の巨匠']],colors=['#ef7744','#56bcd9','#a78bfa','#e9b849','#ec78a9','#55a8ed'];function statXP(i){return Object.values(state.records).reduce((s,r)=>s+(r.legacy||[]).reduce((a,x)=>a+(x[1]===i?x[0]:0),0)+(r.done||[]).reduce((a,j)=>a+(q[j][2]===i?q[j][1]*(r.mult?.[j]||1):0),0),0)}function statRank(v){return tiers.reduce((a,t,j)=>v>=t?j:a,0)}state.statAwards??={};function awardStats(){let events=[];for(let i=0;i<6;i++){let rank=statRank(statXP(i));for(let j=1;j<=rank;j++){let key=i+':'+j;if(!state.statAwards[key]){state.statAwards[key]={amount:cash[j]};events.push([i,j])}}}return events}function statMoney(){return Object.values(state.statAwards).reduce((a,x)=>a+x.amount,0)}function awaken(events){if(!events.length)return;let [i,j]=events[events.length-1];let amount=events.reduce((a,[k,l])=>a+cash[l],0);effect(names[i]+' 覚醒',ranks[j]+' · '+titles[i][j]+(amount?' · ¥'+amount.toLocaleString():''),3,colors[i])}let initialAwards=awardStats();function render(){let r=rec(),xp=score(r),total=Object.values(state.records).reduce((s,r)=>s+score(r),0),[lv,progress,max]=level(total);let weekday=new Date(selected+'T12:00:00').getDay(),mission=['翌週準備・外出','筋トレ','読書10分','筋トレ','柔軟10分','筋トレ','自由・休息'][weekday];let html=`<small>SELF DEVELOPMENT RPG</small><h1>モテ男育成計画</h1><section><small>PLAYER LEVEL</small><div class="large"><strong>Lv.${lv}</strong></div><p>累計 ${total} XP · 次まで ${max-progress} XP</p><progress value="${progress}" max="${max}"></progress></section><nav>${['クエスト','能力値','30日記録','ガチャ'].map((t,i)=>`<button onclick="tab=${i};render()">${t}</button>`).join('')}</nav><p>${selected} <button onclick="selected=date();render()">今日</button></p>`;if(tab===0)html+=`<section><h2>今日のミッション：${mission}</h2>${mission==='筋トレ'?'<small>腕立て10回・リバーススノーエンジェル15回・レッグレイズ10回・サイドプランク左右20秒・スクワット15回 各1セット</small>':''}<p class="large"><strong>${base(r)}</strong> / 50 XP</p><progress value="${Math.min(base(r),50)}" max="50"></progress><p>${clear(r)?'クエストクリア！':'できたことだけチェック'}</p>${q.map((a,i)=>`<label><input type="checkbox" ${r.done.includes(i)?'checked':''} onchange="toggle(${i})">${a[0]}<strong>+${a[1]}</strong></label>`).join('')}<p><small>疲れた日は休息優先。筋トレは月水金を基本に。未達成でも減点なし。旧版の記録は累計XPに保持。</small></p></section>`;if(tab===1)html+=`<section>${names.map((n,i)=>{let v=statXP(i),j=statRank(v),next=tiers[j+1];return `<div style="margin:16px 0"><p style="margin:0"><strong style="color:${colors[i]}">${ranks[j]} · ${n}</strong>　${v} XP</p><small>${titles[i][j]} · ${next? '次まで '+(next-v)+' XP':'最高ランク'}</small><progress style="accent-color:${colors[i]}" value="${next?v-tiers[j]:1}" max="${next?next-tiers[j]:1}"></progress><small>${next?'次の報酬：'+(cash[j+1]?cash[j+1]+'円 ＋ ':'')+'称号':'全ランク達成'}</small></div>`}).join('')}<p>覚醒報酬累計：${statMoney().toLocaleString()}円</p><small>能力値は行動記録の指標です。報酬は各ランク初回のみ。</small></section>`;if(tab===2)html+=`<section><h2>30日間の記録</h2><p>初期ボーナス ★★★</p><div class="days">${Array.from({length:30},(_,i)=>{let k=dayKey(i);return `<button class="${clear(state.records[k])?'clear':''} ${selected===k?'selected':''}" ${k>date()?'disabled':''} onclick="selected='${k}';tab=0;render()">${i+1}</button>`}).join('')}</div><p>緑は50XP達成日。日付を押すと編集できます。</p></section>`;if(tab===3)html+=`<section><h2>ご褒美ガチャ</h2><p>${r.reward||'50XPで解放'}<p>累計ご褒美資金：${(Object.values(state.records).reduce((a,x)=>a+(x.amount||0),0)+statMoney()).toLocaleString()}円</p><small>100円 40% / 200円 30% / 500円 20% / 1,000円 9% / 3,000円 1%</small></p><button class="gold" ${!clear(r)||r.reward?'disabled':''} onclick="draw()">${r.reward?'抽選済み':'宝箱を開ける'}</button><p><small>1日1回、課金なし。資金は自分の予算から。使用期限なし。</small></p></section>`;document.getElementById('app').innerHTML=html+`<small>${save()?'端末内に自動保存':'保存できません。ブラウザ設定を確認してください。'}</small>`}function totalXP(){return Object.values(state.records).reduce((a,r)=>a+score(r),0)}function toggle(i){let r=rec(),before=level(totalXP())[0];if(r.done.includes(i)){r.done=r.done.filter(x=>x!==i);render();return}r.mult??={};if(!r.mult[i]){let u=Math.random();r.mult[i]=u<.02?3:u<.17?2:1}r.done.push(i);let m=r.mult[i],after=level(totalXP())[0],events=awardStats();render();if(events.length){awaken(events);return}effect(after>before?'LEVEL UP':m===3?'超成功':m===2?'大成功':'達成',after>before?'Lv.'+after:'+'+q[i][1]*m+' XP',after>before?3:m)}function draw(){let r=rec();if(!clear(r)||r.reward)return;let roll=Math.random()*100;let [_,rank,amount]=prizes.find(x=>roll<x[0]);r.reward=rank+' · '+amount.toLocaleString()+'円';r.amount=amount;render();effect(rank+' 獲得','¥'+amount.toLocaleString(),rank==='UR'?4:rank==='SSR'?3:rank==='SR'?2:1);}function effect(title,sub,power,color){document.querySelector('.impact')?.remove();let el=document.createElement('div');el.className='impact p'+power;if(color)el.style.setProperty('--fx',color);el.innerHTML=`<div class="rays"></div><svg viewBox="0 0 360 600" preserveAspectRatio="none"><path d="M10 0 L130 170 80 210 190 300 120 420 220 600 M350 0 L240 160 290 210 190 300 270 460 240 600"/></svg><div class="impactText"><b>${title}</b><span>${sub}</span></div>`;document.body.append(el);let timer=setTimeout(()=>el.remove(),power===1?650:2100);el.onclick=()=>{clearTimeout(timer);el.remove()};try{let c=new (window.AudioContext||window.webkitAudioContext)();c.resume();[110,220,440,660].slice(0,power).forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.09;o.type=i===0?'triangle':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.36)});setTimeout(()=>c.close(),900)}catch{}}render();if(initialAwards.length)awaken(initialAwards);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
